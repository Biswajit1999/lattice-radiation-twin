[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-radiation-twin"
version = "0.1.0"
description = "Provenance-first astronomical CCD radiation inference"
requires-python = ">=3.12"
authors = [{name = "Biswajit Jana"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.14", "pre-commit>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
